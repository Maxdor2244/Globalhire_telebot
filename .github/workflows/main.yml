name: GlobalHire Telegram Bot

on:
  workflow_dispatch:

  push:
    branches:
      - main

  # Restart bot secara berkala.
  # GitHub Actions bukan server 24/7, jadi bot perlu dijalankan ulang.
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: write

concurrency:
  group: globalhire-telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    name: Run GlobalHire Bot
    runs-on: ubuntu-latest

    # Jangan biarkan satu proses berjalan terlalu lama.
    timeout-minutes: 290

    env:
      TZ: Asia/Jakarta

      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. SETUP PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ==========================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 4. CHECK CONFIGURATION
      # ==========================================
      - name: Check configuration
        shell: bash
        run: |
          echo "=========================================="
          echo "GlobalHire Telegram Bot"
          echo "=========================================="
          echo "Python:"
          python --version
          echo
          echo "Pip:"
          pip --version
          echo

          if [ -z "$BOT_TOKEN" ]; then
            echo "ERROR: BOT_TOKEN belum diatur."
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "ERROR: CHAT_ID belum diatur."
            exit 1
          fi

          if [ -z "$ADMIN_CHAT_ID" ]; then
            echo "WARNING: ADMIN_CHAT_ID belum diatur."
            echo "Bot tetap dapat berjalan, tetapi perintah admin tidak akan tersedia."
          fi

          echo "BOT_TOKEN: OK"
          echo "CHAT_ID: OK"
          echo "ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:+OK}"
          echo
          echo "Repository files:"
          ls -la

      # ==========================================
      # 5. VALIDATE PYTHON FILES
      # ==========================================
      - name: Validate Python files
        run: |
          python -m py_compile bot.py
          python -m py_compile fetch_loker.py
          echo "Python syntax check: OK"

      # ==========================================
      # 6. RUN TELEGRAM BOT
      # ==========================================
      - name: Run GlobalHire Telegram Bot
        run: |
          echo "=========================================="
          echo "STARTING GLOBALHIRE BOT"
          echo "=========================================="
          echo "Timezone: Asia/Jakarta"
          echo "Schedule:"
          echo "08:00 WIB"
          echo "12:00 WIB"
          echo "19:40 WIB"
          echo "=========================================="

          python -u bot.py

      # ==========================================
      # 7. SHOW LOG WHEN BOT STOPS
      # ==========================================
      - name: Bot stopped
        if: always()
        run: |
          echo "=========================================="
          echo "GlobalHire Bot process has stopped."
          echo "GitHub Actions will start it again."
          echo "=========================================="name: GlobalHire Telegram Bot

